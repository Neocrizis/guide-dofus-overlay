[package]
name = "guide-dofus-overlay"
version = "1.2.0"
description = "Overlay Windows du Guide Dofus, à afficher par-dessus le jeu"
license = "MIT"
repository = "https://github.com/Neocrizis/guide-dofus-overlay"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde_json = "1"
open = "5"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Foundation_Collections", "Win32_Graphics_Gdi", "Win32_System_WinRT"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
