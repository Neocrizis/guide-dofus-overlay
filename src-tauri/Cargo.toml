[package]
name = "guide-dofus-overlay"
version = "1.0.0"
description = "Overlay Windows du Guide Dofus, à afficher par-dessus le jeu"
license = "MIT"
repository = "https://github.com/Neocrizis/guide-dofus-overlay"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde_json = "1"
open = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
